name: Keep Streamlit App Awake

on:
  schedule:
    # ทำงานอัตโนมัติทุกวัน เวลา 08:00 น. (เวลาประเทศไทย = 01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Open and Wake Up Streamlit App
        env:
          APP_URL: ".streamlit.app"
        run: |
          python - << 'EOF'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              print(f"Opening {url} ...")
              page.goto(url, wait_until="networkidle", timeout=60000)
              page.wait_for_timeout(5000)

              wake_btn = page.locator('button:has-text("Yes, get this app back up")')
              if wake_btn.count() > 0:
                  print("App is sleeping. Clicking wake-up button...")
                  wake_btn.first.click()
                  page.wait_for_timeout(20000)
                  print("App woken up successfully!")
              else:
                  print("App is already awake!")

              browser.close()
          EOF
